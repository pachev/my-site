<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
  <style>
    body { margin: 0; font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  .boot {
    width: 1440px;
    height: 900px;
    background: #0d0f0c;
    font-family: 'JetBrainsMono Nerd Font', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #c9cec4;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .boot-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  .logotype {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #f2f0e9;
  }

  .logotype .us {
    color: #a3b3a0;
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .init {
    font-size: 18px;
    letter-spacing: 0.12em;
    color: #c9cec4;
  }

  .dots { color: #6d7268; }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .bar {
    width: 320px;
    height: 16px;
    border: 1px solid #2e312b;
    padding: 2px;
  }

  .bar-fill {
    height: 100%;
    width: 100%;
    background: repeating-linear-gradient(90deg, #a3b3a0 0 14px, #0d0f0c 14px 17px);
  }

  .pct {
    font-size: 14px;
    color: #6d7268;
    letter-spacing: 0.12em;
  }

  .enter {
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.22em;
    padding: 16px 42px;
    background: transparent;
    color: #f2f0e9;
    border: 1px solid #a3b3a0;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease, transform 0.08s ease;
  }

  .enter:hover {
    background: #a3b3a0;
    color: #0d0f0c;
  }

  .enter:active { transform: translateY(2px); }

  .hints {
    margin-top: 28px;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: #4c5148;
  }
  </style>
</helmet>

<div class="boot">
  <div class="boot-inner">
    <div class="logotype">PJ<span class="us">_</span></div>
    <div class="init">initializing lab<span class="dots">...</span></div>
    <div class="bar-row">
      <div class="bar"><div class="bar-fill"></div></div>
      <span class="pct">100%</span>
    </div>
    <button class="enter">ENTER SYSTEM</button>
    <div class="hints">ESC TO SKIP &nbsp;·&nbsp; SKIPPED AUTOMATICALLY ON RETURN VISITS &nbsp;·&nbsp; RESPECTS REDUCED MOTION</div>
  </div>
</div>
</x-dc>
</body>
</html>
